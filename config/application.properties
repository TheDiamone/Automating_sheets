# ─────────────────────────────────────────────────────────────
# Google Sheet Automation — Runtime Configuration
# ─────────────────────────────────────────────────────────────

# The ID of the Google Spreadsheet to operate on.
# Find it in the URL: https://docs.google.com/spreadsheets/d/THIS_PART/edit
spreadsheet.id=1GeQY8euX75H1g16P83CPB_BaoaOHqAckRcb9f6ORPsc

# The exact name of the template tab in the spreadsheet.
# This sheet is used as the source when duplicating tabs.
template.sheet.name=BLANK

# Path to your service account JSON key file.
# Resolved relative to wherever you run the program from.
credentials.path=credentials/service-account.json

# Path to the CSV file containing resident names and IDs.
residents.file=config/billing.csv

# Row range for the hide-empty-rows command (1-based, inclusive).
hide.start.row=2
hide.end.row=159

# How long to pause between processing sheets (milliseconds).
# Keeps the program within Google's API rate limits.
sleep.between.sheets.ms=1000


# ─────────────────────────────────────────────────────────────
# Billing CSV Configuration (delete-unbilled-columns)
# ─────────────────────────────────────────────────────────────

# Main billing CSV source (also used by create-tabs via residents.file above)
billing.file=config/billing.csv

# Column header names in billing.csv
billing.name.column=Resident Name
billing.id.column=Resident Number

# The status value that means billed.  Only A = billed.  D, HN, blank = not billed.
billing.status.keep.value=A

# The Google Sheet column letter where day 1 of the billing month is located.
# The program auto-detects the number of days from billing.csv and calculates the last column.
# Example: if May 1 is in column B, the program calculates that May 31 is in column AF.
#          For a 30-day month it would be AE, for 28 days AC, for 29 days AD.
billing.sheet.first.day.column=B

# Pause between resident tabs (milliseconds)
billing.sleep.between.sheets.ms=1000

# Safety: set to true to allow live column deletion (delete-unbilled-columns without --dry-run).
# Leave false or omit to prevent accidental permanent deletion.
billing.allow.delete.columns=false
